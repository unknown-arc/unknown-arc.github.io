<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>contact me. — Ankit Kumar Singh — Portfolio.</title>
<meta name="description" content="Contact form">
<link rel="icon" href="favicon.ico">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css">
<script src="js/theme-init.js"></script>
</head>
<body>
<header class="site-header" id="site-header"></header>

<div class="wrap">
  <main>
    <article class="article">
      <h1 class="title">contact me.</h1>

      <form id="contact-form" novalidate>
        <input type="text" id="cf-website" name="website" tabindex="-1" autocomplete="off" class="honeypot">

        <div class="contact-grid">
          <div class="field">
            <input class="input" id="cf-name" type="text" placeholder="Name" autocomplete="given-name">
          </div>
          <div class="field">
            <input class="input" id="cf-email" type="email" placeholder="Email" autocomplete="email">
          </div>
          <div class="field field-message">
            <textarea class="textarea" id="cf-message" rows="4" placeholder="Drop a note with any website feedback or career opportunities, or just say hi. Where are you from? 😊"></textarea>
          </div>
        </div>

        <div class="contact-actions">
          <button type="submit" class="btn btn-default btn-full" id="cf-submit">
            <div style="display:flex;align-items:center">
              <span>Send Message</span>
              <i data-lucide="send" style="margin-left:.5rem;width:1rem;height:1rem"></i>
            </div>
          </button>
          <p class="contact-note">By submitting this form, I agree to the <a href="privacy.html" class="link" style="font-weight:600">privacy&nbsp;policy.</a></p>
        </div>
      </form>
    </article>
  </main>
</div>

<footer class="site-footer" id="site-footer"></footer>

<div class="chat-root" id="chat-root"></div>

<!-- confirm dialog -->
<div class="overlay" id="confirm-overlay">
  <div class="dialog">
    <h2>Just a quick check! 🤔</h2>
    <div>
      <p>Hey! Remember to use a real email so I can reply you personally.</p>
      <p style="font-weight:500">I'll be sending my reply to: <span class="highlight" id="confirm-email"></span></p>
    </div>
    <div class="dialog-footer">
      <button class="btn btn-outline" id="confirm-cancel" type="button">Let me fix that</button>
      <button class="btn btn-default" id="confirm-send" type="button">
        <span>Send</span>
        <i data-lucide="send" style="margin-left:.5rem;width:1rem;height:1rem"></i>
      </button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="js/data.js"></script>
<script src="js/render.js"></script>
<script src="js/app.js"></script>
<script src="js/chat.js"></script>
<script src="js/contact.js"></script>
<script>
  SiteRender.renderHeader("contact.html");
  SiteRender.renderFooter();
  initThemeToggle();
  initChat();
  initContactForm();
  if (window.lucide) window.lucide.createIcons();
</script>
</body>
</html>
